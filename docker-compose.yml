services:
  postgres:
    # 1. 使用预装了pgvector的官方镜像
    image: docker.m.daocloud.io/pgvector/pgvector:pg16
    container_name: postgres-pgvector
    restart: always
    environment:
      POSTGRES_USER: admin        # 替换为你的数据库用户名
      POSTGRES_PASSWORD: secret123    # 替换为你的数据库密码
      POSTGRES_DB: appdb          # 替换为你的数据库名
    ports:
      - "5432:5432"                       # 将宿主机5432端口映射到容器5432端口
    volumes:
      - /home/cgl/v7ai-data/postgres:/var/lib/postgresql/data  # 数据库持久化目录(WSL)

  minio:
    # 官方版本号：RELEASE.2024-11-07T00-52-20Z (这是2024年一个较新的稳定版)
    image: docker.m.daocloud.io/minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - /home/cgl/v7ai-data/minio:/data
    command: server /data --console-address ":9001"
