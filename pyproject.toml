[project]
name = "v7ai-fast"
version = "1.0.0"
description = "FastAPI implementation of v7demo project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bcrypt>=4.0.0",
    "cryptography>=48.0.1",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "psycopg2-binary>=2.9.10",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.50",
    "uvicorn>=0.49.0",
    "minio>=7.2.0",
    "pgvector>=0.4.0",
    "sentence-transformers>=3.0.0",
    "openpyxl>=3.1.0",
    "pypdf>=5.0.0",
    "python-docx>=1.2.0",
    "langgraph>=1.2.4",
    "langchain-openai>=1.3.0",
    "langgraph-checkpoint>=4.1.1",
    "llama-index-core>=0.12.0",
    "alembic>=1.13.0",
    "pytest>=8.0.0",
    "pdf2docx>=0.5.8",
    "jieba>=0.42.1",
    "rank-bm25>=0.2.2",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv]
link-mode = "copy"
